; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
monitor_rts = 0
monitor_dtr = 0
monitor_filters =
	time
	esp32_exception_decoder
; If PlatformIO opens the wrong serial monitor port, set both lines below
; to the same COM port shown during upload, for example COM8.
; upload_port = COM8
; monitor_port = COM8
build_flags = 
	-DESP32
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DMO_NUMCONNECTORS=9
	-DMO_CUSTOM_WS
	-DMO_NUM_REQUEST_QUEUES=32
	-DMO_REQUEST_CACHE_MAXSIZE=32
	-Wall
	-Os
	-fstack-protector-strong
lib_deps = 
	matth-x/MicroOcpp@^1.0.0
	emelianov/modbus-esp8266@^4.1.0
	adafruit/Adafruit NeoPixel@^1.12.4
	uipethernet/UIPEthernet@^2.0.12
lib_ignore = SomeHeavyLibrary
board_build.flash_size = 16MB
